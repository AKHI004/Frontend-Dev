<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Multilingual Webpage</title>
  </head>
  <body>
    <h2>Multilingual Webpage Example</h2>

    <p><strong>English:</strong> Welcome to my website! I hope you have a great day.</p>

    <p><strong>हिन्दी:</strong> मेरी वेबसाइट पर आपका स्वागत है! आपका दिन शुभ हो।</p>

    <p><strong>Français:</strong> Bienvenue sur mon site web ! J’espère que vous passez une bonne journée.</p>
  </body>
</html>
