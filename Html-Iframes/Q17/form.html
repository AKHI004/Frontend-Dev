<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Form Submission with Iframe</title>
  </head>
  <body>
    <center>
      <h2>Submit Your Form</h2>
      <form action="result.html" method="get" target="resultFrame">
        <label for="name">Enter your name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        <input type="submit" value="Submit">
      </form>

      <br><br>

      <iframe
        name="resultFrame"
        width="80%"
        height="150"
        title="Form Result"
        frameborder="1">
      </iframe>
    </center>
  </body>
</html>
