<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Embed External Website</title>
  </head>
  <body>
    <center>
      <h2>Embedded Website Example</h2>
      <iframe
        src="https://www.wikipedia.org"
        width="80%"
        height="500"
        title="Wikipedia Homepage"
        frameborder="0">
      </iframe>

      <p>Some websites may not allow embedding for security reasons.</p>
    </center>
  </body>
</html>
