<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Blog Posts</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Blog Manager</h1>

    <button id="addPost">Add New Post</button>
    <button id="prependPost">Prepend Featured Post</button>
    <button id="removeLast">Remove Last Post</button>

    <br><br>

    <input type="text" id="tagInput" placeholder="Enter tag">
    <button id="addTagBtn">Add Tag</button>

    <br><br>

    <input type="text" id="keywordInput" placeholder="Highlight keyword">
    <button id="highlightBtn">Highlight</button>

    <ul id="postList">
        <li class="post">Welcome to our new blog.</li>
        <li class="post">Latest updates about technology.</li>
        <li class="post">Tips for better productivity.</li>
    </ul>

</body>
</html>
