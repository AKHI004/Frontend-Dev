<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive FAQ</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <h1>FAQ Section</h1>

    <section class="faq">

        <div class="item">
            <h3 class="question">What is your return policy?</h3>
            <p class="answer" style="display:none;">We accept returns within 7 days.</p>
            <input type="text" placeholder="Your comment...">
        </div>

        <hr>

        <div class="item">
            <h3 class="question">How long is delivery time?</h3>
            <p class="answer" style="display:none;">Delivery takes 3-5 business days.</p>
            <input type="text" placeholder="Your comment...">
        </div>

        <hr>

        <div class="item">
            <h3 class="question">Do you offer warranty?</h3>
            <p class="answer" style="display:none;">Yes, 1 year warranty included.</p>
            <input type="text" placeholder="Your comment...">
        </div>

    </section>
</body>
</html>
