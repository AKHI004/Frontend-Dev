<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Courses</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Course Finder</h1>

    <input type="text" id="searchBox" placeholder="Search course...">
    <button id="clearBtn">Clear</button>

    <p id="matchCount"></p>

    <ul id="courseList">
        <li class="course">Java Programming</li>
        <li class="course">Data Structures</li>
        <li class="course">Web Development</li>
        <li class="course">Machine Learning</li>
        <li class="course">Cyber Security</li>
        <li class="course">Cloud Computing</li>
    </ul>

</body>
</html>
