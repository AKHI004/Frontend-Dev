<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-jQuery Widgets</title>

    <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
    <script>
        var jq1 = jQuery.noConflict(true);
    </script>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        var jq2 = jQuery.noConflict(true);
    </script>

    <script src="script.js" defer></script>
</head>

<body>

    <h1>Dashboard</h1>

    <div id="carousel">
        <p class="slide">Slide 1</p>
        <p class="slide">Slide 2</p>
        <p class="slide">Slide 3</p>
    </div>

    <br>

    <button id="notifyBtn">Show Notification</button>

    <div id="modal" style="display:none;">
        <p>This is a notification popup.</p>
        <button id="closeModal">Close</button>
    </div>

    <br>

    <div class="widget" title="Widget information">Widget A</div>
    <div class="widget" title="Widget information">Widget B</div>

</body>
</html>
