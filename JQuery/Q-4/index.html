<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offer Banner</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Special Offers</h1>

    <section id="banners">

        <div class="banner">50% OFF on Electronics</div>
        <hr>
        <div class="banner">Buy 1 Get 1 Free</div>
        <hr>
        <div class="banner">Free Shipping on Orders Above ₹499</div>

    </section>

    <br>

    <button id="hideBtn">Hide Banners</button>
    <button id="showBtn">Show Banners</button>
    <button id="slideBtn">Slide Toggle</button>
    <button id="fadeBtn">Fade Toggle</button>

</body>
</html>
