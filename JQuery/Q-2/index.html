<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Highlight</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <h1>Product List</h1>

    <section id="productSection">

        <div class="product" data-stock="in" data-discount="yes">
            <h3>Wireless Headphones</h3>
            <p class="details" style="display:none;">Battery life: 20 hours</p>
            <span class="fav">♡</span>
        </div>

        <hr>

        <div class="product" data-stock="out">
            <h3>Smart Watch</h3>
            <p class="details" style="display:none;">Heart-rate + GPS</p>
            <span class="fav">♡</span>
        </div>

        <hr>

        <div class="product" data-stock="in" data-discount="yes">
            <h3>Bluetooth Speaker</h3>
            <p class="details" style="display:none;">Waterproof</p>
            <span class="fav">♡</span>
        </div>

        <hr>

        <div class="product" data-stock="in">
            <h3>USB-C Charger</h3>
            <p class="details" style="display:none;">Fast Charging</p>
            <span class="fav">♡</span>
        </div>

    </section>
</body>
</html>
