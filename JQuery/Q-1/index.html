<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Greeting</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>Welcome Page</h1>
    </header>

    <main>
        <section>
            <h2 id="greetingText">Hello!</h2>

            <p id="welcomeMsg">
                This is your personalized welcome message.
            </p>

            <button id="changeGreetingBtn">Change Greeting</button>
            <button id="toggleMsgBtn">Toggle Welcome Message</button>
        </section>
    </main>
</body>
</html>
