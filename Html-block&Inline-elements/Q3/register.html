<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Registration Form</title>
</head>
<body>

  <header>
    <h1>Course Registration Form</h1>
  </header>

  <main>
    <form>
      <fieldset>
        <legend>Student Information</legend>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email Address:</label><br>
        <input type="email" id="email" name="email" required><br><br>
      </fieldset>

      <fieldset>
        <legend>Course Selection</legend>
        <label for="course">Choose a Course:</label><br>
        <select id="course" name="course" required>
          <option value="">-- Select a Course --</option>
          <option value="webdev">Web Development</option>
          <option value="datasci">Data Science</option>
          <option value="ai">Artificial Intelligence</option>
          <option value="cybersec">Cyber Security</option>
        </select><br><br>
      </fieldset>

      <fieldset>
        <legend>Available Course Schedules</legend>
        <table border="1" cellpadding="8" cellspacing="0" width="100%">
          <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Instructor</th>
          </tr>
          <tr>
            <td>Monday</td>
            <td>10:00 AM - 12:00 PM</td>
            <td>Dr. Meera Sharma</td>
          </tr>
          <tr>
            <td>Wednesday</td>
            <td>2:00 PM - 4:00 PM</td>
            <td>Mr. Arjun Patel</td>
          </tr>
          <tr>
            <td>Friday</td>
            <td>11:00 AM - 1:00 PM</td>
            <td>Ms. Priya Nair</td>
          </tr>
        </table>
      </fieldset><br>

      <input type="submit" value="Submit Registration">
      <input type="reset" value="Clear Form">
    </form>
  </main>

  <footer>
    <p>&copy; 2025 EduLearn Institute. All rights reserved.</p>
  </footer>

</body>
</html>
