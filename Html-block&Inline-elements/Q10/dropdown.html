<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dropdown Selection Page</title>
</head>
<body>

  <header>
    <h1>Travel Preferences Selection</h1>
  </header>

  <main>
    <form>
      <label for="country">Select Country:</label><br>
      <select id="country" name="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Italy</option>
        <option>Australia</option>
      </select><br><br>

      <label for="state">Select State:</label><br>
      <select id="state" name="state">
        <option selected>Maharashtra</option>
        <option>Karnataka</option>
        <option>Delhi</option>
        <option>Tamil Nadu</option>
        <option>Rajasthan</option>
      </select><br><br>

      <label for="city">Select City:</label><br>
      <select id="city" name="city">
        <option selected>Mumbai</option>
        <option>Bengaluru</option>
        <option>Chennai</option>
        <option>Jaipur</option>
        <option>New Delhi</option>
      </select><br><br>

      <label for="place">Select Favorite Tourist Place:</label><br>
      <select id="place" name="place">
        <option selected>Gateway of India</option>
        <option>Taj Mahal</option>
        <option>Hampi</option>
        <option>Jaipur City Palace</option>
        <option>Marina Beach</option>
      </select><br><br>

      <p>You have selected <strong>India</strong> → <strong>Maharashtra</strong> → <strong>Mumbai</strong>, and your favorite tourist place is <strong>Gateway of India</strong>.</p>
    </form>
  </main>

  <footer>
    <p>&copy; 2025 Travel Selector. All rights reserved.</p>
  </footer>

</body>
</html>
