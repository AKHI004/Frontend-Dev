<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>

  <header>
    <h1>Wanderlust Moments</h1>
    <p>Explore breathtaking travel destinations</p>
  </header>

  <main>
    <section class="gallery">
      <div class="photo">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" alt="Mountain View">
        <div class="caption">Majestic Mountains</div>
      </div>

      <div class="photo">
        <img src="https://images.unsplash.com/photo-1493558103817-58b2924bce98?auto=format&fit=crop&w=800&q=80" alt="Beach">
        <div class="caption">Golden Beaches</div>
      </div>

      <div class="photo">
        <img src="https://images.unsplash.com/photo-1482192596544-9eb780fc7f66?auto=format&fit=crop&w=800&q=80" alt="City Lights">
        <div class="caption">City Lights</div>
      </div>

      <div class="photo">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" alt="Ocean">
        <div class="caption">Ocean Breeze</div>
      </div>

      <div class="photo">
        <img src="https://images.unsplash.com/photo-1519817650390-64a93db511aa?auto=format&fit=crop&w=800&q=80" alt="Desert">
        <div class="caption">Desert Serenity</div>
      </div>

      <div class="photo">
        <img src="https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=800&q=80" alt="Forest">
        <div class="caption">Forest Trails</div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Wanderlust Moments. All rights reserved.</p>
  </footer>

</body>
</html>
