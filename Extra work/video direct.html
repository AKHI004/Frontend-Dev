<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Autoplay MrBeast Video</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#071223;color:#e6f7ff;font-family:Inter,system-ui,Segoe UI,Roboto,Arial}
  .wrap{width:100%;max-width:1000px;padding:24px}
  .video-wrap{position:relative;width:100%;padding-top:56.25%;background:#000;border-radius:10px;overflow:hidden;box-shadow:0 18px 50px rgba(2,8,20,0.6)}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .controls{display:flex;gap:12px;align-items:center;justify-content:center;margin-top:14px}
  .btn{background:#0b3950;border:1px solid rgba(255,255,255,0.04);color:#bfefff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:600}
</style>
</head>
<body>
  <div class="wrap" role="main">
    <div class="video-wrap" aria-label="MrBeast video">
      <!-- MrBeast video ID Wdjh81uH6FU (example). Autoplay requires mute in most browsers. -->
      <iframe id="ytplayer"
        src="https://www.youtube.com/embed/Wdjh81uH6FU?autoplay=1&mute=1&rel=0&controls=1&modestbranding=1&playsinline=1"
        title="MrBeast video"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="controls" aria-hidden="false">
      <button id="unmute" class="btn" aria-label="Unmute and play">Unmute & Play</button>
      <button id="open" class="btn" aria-label="Open on YouTube">Open on YouTube</button>
    </div>
  </div>

<script>
  // Load YouTube IFrame API
  const tag = document.createElement('script');
  tag.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(tag);

  let player;
  function onYouTubeIframeAPIReady(){
    player = new YT.Player('ytplayer', {
      events: {
        onReady: () => {
          // player ready; it's already loaded with autoplay=1&mute=1
        }
      }
    });
  }

  document.getElementById('unmute').addEventListener('click', () => {
    // user gesture allows unmute
    if (player && player.unMute) {
      player.unMute();
      player.playVideo();
    } else {
      // fallback: reload iframe without mute
      const iframe = document.getElementById('ytplayer');
      iframe.src = iframe.src.replace('mute=1','mute=0') + '&autoplay=1';
    }
  });

  document.getElementById('open').addEventListener('click', () => {
    window.open('https://www.youtube.com/watch?v=Wdjh81uH6FU', '_blank', 'noopener');
  });

  // Expose API callback globally (required by YouTube)
  window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
</script>
</body>
</html>
