<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple YouTube Embed</title>
  <style>
    body{display:flex;align-items:center;justify-content:center;height:100vh;margin:0;background:#071121;color:#fff;font-family:system-ui}
    .video{width:90%;max-width:980px;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
    iframe{width:100%;height:100%;border:0}
    .hint{margin-top:12px;color:#bcd; font-size:14px; text-align:center}
  </style>
</head>
<body>
  <div>
    <div class="video">
      <!-- Replace VIDEO_ID with the YouTube video id -->
      <iframe
        src="https://www.youtube.com/embed/VIDEO_ID?autoplay=1&mute=1&controls=1&rel=0&playsinline=1"
        title="YouTube video"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>
    <div class="hint">Autoplay will work muted on most browsers; click the video or use the browser controls to unmute.</div>
  </div>
</body>
</html>
