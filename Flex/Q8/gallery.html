<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="gallery.css">
</head>
<body>
    <div class="container">
        <h1>Photo Gallery</h1>
        
        <div class="gallery">
            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=1" alt="Nature 1">
                <figcaption>Mountain Landscape</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=2" alt="Nature 2">
                <figcaption>Ocean Sunset</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=3" alt="Nature 3">
                <figcaption>Forest Trail</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=4" alt="Nature 4">
                <figcaption>Desert Dunes</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=5" alt="Nature 5">
                <figcaption>City Skyline</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=6" alt="Nature 6">
                <figcaption>Tropical Beach</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=7" alt="Nature 7">
                <figcaption>Snow Mountains</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=8" alt="Nature 8">
                <figcaption>Waterfall</figcaption>
            </figure>

            <figure class="gallery-item">
                <img src="https://picsum.photos/400/300?random=9" alt="Nature 9">
                <figcaption>Garden Flowers</figcaption>
            </figure>
        </div>
    </div>
</body>
</html>
