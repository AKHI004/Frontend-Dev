<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="card_flip.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-inner">
                <!-- Front side of the card -->
                <div class="card-front">
                    <h2>Beautiful Nature</h2>
                    <img src="./images/mountains.jpeg" alt="Nature">
                </div>
                <!-- Back side of the card -->
                <div class="card-back">
                    <h2>About Nature</h2>
                    <p>Nature, in the broadest sense, is the physical world or universe. "Nature" can refer to the phenomena of the physical world, and also to life in general.</p>
                    <p>The beauty of nature is unmatched and provides endless inspiration.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
