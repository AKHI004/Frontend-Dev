<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard">
        <!-- Header -->
        <header>
            <h1>Dashboard</h1>
            <p>Welcome back, User!</p>
        </header>

        <!-- Sidebar -->
        <aside class="sidebar">
            <nav>
                <a href="#home" class="active">🏠 Home</a>
                <a href="#analytics">📊 Analytics</a>
                <a href="#reports">📄 Reports</a>
                <a href="#users">👥 Users</a>
                <a href="#settings">⚙️ Settings</a>
                <a href="#help">❓ Help</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="box box-1">
                <h2>Total Sales</h2>
                <p class="stat">Stats</p>
                <p class="change">Change in Stats
                </p>
            </div>

            <div class="box box-2">
                <h2>New Users</h2>
                <p class="stat">Stats</p>
                <p class="change">Change in Stats</p>
            </div>

            <div class="box box-3">
                <h2>Revenue Overview</h2>
                <p class="stat">Stats</p>
                <p class="change">Change in Stats</p>
            </div>

            <div class="box box-4">
                <h2>Active Projects</h2>
                <p class="stat">Stats</p>
                <p class="change">Change in Stats</p>
            </div>
        </main>
    </div>
</body>
</html>
